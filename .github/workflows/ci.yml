name: vector-stage1-offline
on:
  push:
    branches: [main, "build/**"]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic pytest
      - run: PYTHONPATH=. pytest -q
        env:
          VECTOR_OFFLINE: "1"
      - run: PYTHONPATH=. python -m vector.demo.run_stage1
        env:
          VECTOR_OFFLINE: "1"
